name: Visual QA cross-device

on:
  push:
    branches:
      - apple-design-fluid
    paths:
      - "scripts/**"
      - ".github/workflows/visual-qa-cross-device.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: "https://website-preview-6vmb6tjhl-scappes-projects.vercel.app/?_vercel_share=e58MYUczNAsFVCj7COyrLP43dXhJta47"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run visual QA
        run: node scripts/visual-qa.mjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axante-visual-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
