name: Visual QA cross-device

on:
  push:
    branches:
      - apple-design-fluid
    paths:
      - "scripts/**"
      - ".github/workflows/visual-qa-cross-device.yml"
      - "package.json"
      - "servizi.html"
      - "servizi-premium.css"
      - "servizi-premium.js"
      - "portfolio.html"
      - "contatti.html"
      - "contact-intake.css"
      - "contact-intake.js"
      - "chi-siamo.html"
      - "about-operating.css"
      - "about-operating.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: "http://127.0.0.1:4173/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/axante-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/axante-http.log
          exit 1

      - name: Run homepage visual QA
        run: node scripts/visual-qa.mjs

      - name: Run services visual QA
        run: node scripts/visual-qa-services.mjs

      - name: Run portfolio visual QA
        run: node scripts/visual-qa-portfolio.mjs

      - name: Run contact intake visual QA
        run: node scripts/visual-qa-contact.mjs

      - name: Run studio operating visual QA
        run: node scripts/visual-qa-about.mjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axante-visual-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
