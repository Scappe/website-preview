name: Visual QA cross-device

on:
  push:
    branches:
      - apple-design-fluid
    paths:
      - "scripts/**"
      - ".github/workflows/visual-qa-cross-device.yml"
      - "package.json"
      - "foundation-mobile-hotfix.css"
      - "site/home-v5.js"
      - "servizi.html"
      - "servizi-premium.css"
      - "servizi-premium.js"
      - "portfolio.html"
      - "contatti.html"
      - "contact-intake.css"
      - "contact-intake.js"
      - "chi-siamo.html"
      - "about-operating.css"
      - "about-operating.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: "http://127.0.0.1:4173/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve built site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/axante-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/axante-http.log
          exit 1

      - name: Run homepage visual QA
        id: home_qa
        run: |
          set +e
          node scripts/visual-qa.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run services visual QA
        id: services_qa
        run: |
          set +e
          node scripts/visual-qa-services.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run portfolio visual QA
        id: portfolio_qa
        run: |
          set +e
          node scripts/visual-qa-portfolio.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run contact intake visual QA
        id: contact_qa
        run: |
          set +e
          node scripts/visual-qa-contact.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run studio operating visual QA
        id: about_qa
        run: |
          set +e
          node scripts/visual-qa-about.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce visual QA result
        if: always()
        run: |
          echo "home=${{ steps.home_qa.outputs.code }}"
          echo "services=${{ steps.services_qa.outputs.code }}"
          echo "portfolio=${{ steps.portfolio_qa.outputs.code }}"
          echo "contact=${{ steps.contact_qa.outputs.code }}"
          echo "about=${{ steps.about_qa.outputs.code }}"
          test "${{ steps.home_qa.outputs.code }}" = "0"
          test "${{ steps.services_qa.outputs.code }}" = "0"
          test "${{ steps.portfolio_qa.outputs.code }}" = "0"
          test "${{ steps.contact_qa.outputs.code }}" = "0"
          test "${{ steps.about_qa.outputs.code }}" = "0"

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axante-visual-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
