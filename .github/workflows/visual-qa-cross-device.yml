name: Visual QA cross-device

on:
  push:
    branches:
      - apple-design-fluid
    paths-ignore:
      - "**/*.md"
      - "diagnostics/**"
      - "qa-screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: "http://127.0.0.1:4173/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve built site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/axante-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/axante-http.log
          exit 1

      - name: Run homepage visual QA
        id: home_qa
        run: |
          set +e
          node scripts/visual-qa.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run services visual QA
        id: services_qa
        run: |
          set +e
          node scripts/visual-qa-services.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run portfolio visual QA
        id: portfolio_qa
        run: |
          set +e
          node scripts/visual-qa-portfolio.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run contact intake visual QA
        id: contact_qa
        run: |
          set +e
          node scripts/visual-qa-contact.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run human studio story visual QA
        id: about_qa
        run: |
          set +e
          node scripts/visual-qa-about.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture benchmark evidence
        id: benchmark_qa
        run: |
          set +e
          node scripts/benchmark-capture.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce visual QA result
        if: always()
        run: |
          failed=0
          check_suite() {
            name="$1"
            code="$2"
            echo "$name=$code"
            if [ "$code" != "0" ]; then
              echo "::error title=Visual QA suite failure::$name exited with code ${code:-missing}"
              failed=1
            fi
          }
          check_suite home "${{ steps.home_qa.outputs.code }}"
          check_suite services "${{ steps.services_qa.outputs.code }}"
          check_suite portfolio "${{ steps.portfolio_qa.outputs.code }}"
          check_suite contact "${{ steps.contact_qa.outputs.code }}"
          check_suite about "${{ steps.about_qa.outputs.code }}"
          check_suite benchmark "${{ steps.benchmark_qa.outputs.code }}"
          exit "$failed"

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axante-visual-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14