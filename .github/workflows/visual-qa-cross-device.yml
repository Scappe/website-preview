name: Visual QA cross-device

on:
  push:
    branches:
      - apple-design-fluid
    paths:
      - "scripts/**"
      - "site/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/visual-qa-cross-device.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project
        run: npm install

      - name: Build site
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve dist
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/axante-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/axante-http.log
          exit 1

      - name: Run visual QA
        run: node scripts/visual-qa.mjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axante-visual-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
